<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>무한의당근 - Endless Jump</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      canvas { display: block; width: 100%; height: 100%; }

      /* 로딩 스플래시 */
      #loading {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #1a1a3e 0%, #2d4a7a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 0.4s ease-out;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading .title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      }
      #loading .subtitle {
        font-size: 13px;
        opacity: 0.7;
        margin-bottom: 32px;
      }
      #loading .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.15);
        border-top-color: #FFD700;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 24px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #loading .bar-wrap {
        width: 220px;
        height: 6px;
        background: rgba(255,255,255,0.12);
        border-radius: 3px;
        overflow: hidden;
      }
      #loading .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #FF6B35, #FFD700);
        border-radius: 3px;
        transition: width 0.2s ease-out;
      }
      #loading .pct {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading" role="progressbar" aria-label="로딩 중">
      <div class="title">🥕 무한의당근</div>
      <div class="subtitle">에셋을 불러오는 중...</div>
      <div class="spinner"></div>
      <div class="bar-wrap"><div class="bar" id="loading-bar"></div></div>
      <div class="pct" id="loading-pct">0%</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
